[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadreckoning"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "networkx",
    "pydantic",
    "docker",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
deadreckoning = "deadreckoning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "local: requires a local real-execution dependency (R/Julia/Stata/MATLAB/Docker/compilers) — a superset of stata/matlab/docker below, kept for the 'run everything real' local-dev shorthand",
    "docker: requires Docker daemon — subset of local",
    "stata: requires a licensed Stata installation — not available in CI",
    "matlab: requires a licensed MATLAB installation — not available in CI",
    "llm: real Anthropic API calls — excluded from CI unless ANTHROPIC_API_KEY set",
]
