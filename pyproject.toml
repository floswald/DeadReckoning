[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadreckoning"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "networkx",
    "pydantic",
    "docker",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
deadreckoning = "deadreckoning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "local: requires local R/Docker installation — not run in CI",
    "docker: requires Docker daemon — subset of local",
    "llm: real Anthropic API calls — excluded from CI unless ANTHROPIC_API_KEY set",
]
